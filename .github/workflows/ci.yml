
name: Spring Boot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show application configuration
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          echo "Application: $APP_NAME"
          echo "Environment: ${{ vars.APP_ENV }}"
          if [ -n "$DEMO_TOKEN" ]; then
            echo "Demo token is configured"
          else
            echo "Demo token is not configured"
          fi
          

      - name: Run tests
        run: mvn --batch-mode test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and verify
        run: mvn --batch-mode clean verify

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-build
          path: target/*.jar
          if-no-files-found: error