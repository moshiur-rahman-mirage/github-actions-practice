
name: Hello Action
description: Reusable Java CI steps

inputs:
  app-name:
    description: Application name
    required: true

runs:
  using: composite
  steps:
    - name: Print application name
      shell: bash
      run: echo "Application: ${{ inputs.app-name }}"

    - name: Print Java version
      shell: bash
      run: java -version

    - name: Print completion message
      shell: bash
      run: echo "Composite action completed"